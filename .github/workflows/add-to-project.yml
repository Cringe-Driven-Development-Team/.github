name: Add issues to project

on:
  workflow_call:
    secrets:
      ADD_TO_PROJECT_PAT:
        required: true

env:
  PROJECT_OWNER: Cringe-Driven-Development-Team
  PROJECT_NUMBER: 1

jobs:
  add-to-project:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          PROJECT_ID=$(gh api graphql \
            -f query='query($owner: String!, $number: Int!) {
              organization(login: $owner) { projectV2(number: $number) { id } }
            }' \
            -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" \
            --jq '.data.organization.projectV2.id')

          gh api graphql \
            -f query='mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: { projectId: $project, contentId: $issue }) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" -f issue="$ISSUE_ID"
