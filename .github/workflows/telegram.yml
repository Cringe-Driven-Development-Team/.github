name: Уведомления в Telegram

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    # одиночные комментарии ревью приходят по одному событию: следующий комментарий того же ревьювера
    # к тому же PR отменяет ждущий запуск, и в чат уходит одно сообщение на серию.
    # Остальные события получают свою группу и друг друга не отменяют
    concurrency:
      group: ${{ github.event_name == 'pull_request_review' && format('tg-review-{0}-{1}-{2}', github.repository, github.event.pull_request.number, github.event.review.user.login) || format('tg-{0}', github.run_id) }}
      cancel-in-progress: true
    steps:
      - name: Отправить сообщение
        env:
          TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:      ${{ vars.TELEGRAM_CHAT_ID }}
          TOPIC:     ${{ vars.TELEGRAM_TOPIC_ID }}
          REVIEW_TOPIC: ${{ vars.TELEGRAM_REVIEW_TOPIC_ID }}
          MAP:       ${{ vars.TELEGRAM_USER_MAP }}
          EVENT:     ${{ github.event_name }}
          ACTION:    ${{ github.event.action }}
          MERGED:    ${{ github.event.pull_request.merged }}
          DRAFT:     ${{ github.event.pull_request.draft }}
          BASE:      ${{ github.event.pull_request.base.ref }}
          REVIEW:    ${{ github.event.review.state }}
          REVIEW_BY: ${{ github.event.review.user.login }}
          REVIEW_BY_TYPE: ${{ github.event.review.user.type }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REVIEWER:  ${{ github.event.requested_reviewer.login }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR:     ${{ github.actor }}
          REPO:      ${{ github.repository }}
          OWNER:     ${{ github.repository_owner }}
          NUMBER:    ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE:     ${{ github.event.issue.title || github.event.pull_request.title }}
          URL:       ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          BRANCH:    ${{ github.event.ref }}
          COMMITS:   ${{ toJSON(github.event.commits) }}
          COMPARE:   ${{ github.event.compare }}
          FORCED:    ${{ github.event.forced }}
          DELETED:   ${{ github.event.deleted }}
          BEFORE:    ${{ github.event.before }}
          AFTER:     ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # в payload пуша — эпоха в секундах; сверяем с closed_at, чтобы не спутать корректирующий force-push со старым закрытием
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
          BODY:      ${{ github.event.issue.body }}
          ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
          CREATED:   ${{ github.event.issue.created_at }}
          UPDATED:   ${{ github.event.issue.updated_at }}
          CHG_BODY:  ${{ toJSON(github.event.changes.body) }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BY: ${{ github.event.comment.user.login }}
          COMMENT_BY_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          # комментарий в обсуждении PR приходит как комментарий к issue с полем pull_request
          IS_PR:     ${{ github.event.issue.pull_request != null }}
          REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers) }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          GH_TOKEN:  ${{ github.token }}
        run: |
          # без токена или чата Telegram ответит невнятной ошибкой — называем, чего не хватает
          [ -n "$TOKEN" ] || { echo "::error::Не задан секрет TELEGRAM_BOT_TOKEN"; exit 1; }
          [ -n "$CHAT" ] || { echo "::error::Не задана переменная TELEGRAM_CHAT_ID"; exit 1; }

          WHO="$ACTOR"
          EXTRA=""
          MARKUP='{"inline_keyboard":[]}'
          # всё про ревью — в отдельный топик; не задан — в обычный
          RTOPIC="${REVIEW_TOPIC:-$TOPIC}"
          DEST="$TOPIC"
          # opened — открытие PR, requested — запрос ревью: вместо одного логина автор и ревьюверы
          KIND=""
          REVS=""
          # у повторного запроса ревью — что изменилось с прошлого ревью
          REVIEW_DELTA=""
          # сообщение без цитаты — если Telegram не разберёт её разметку
          BARE=""
          # строка под заголовком пуша: что стало с веткой после force-push
          NOTE=""

          esc () { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          # plural 3 коммит коммита коммитов → «коммита»
          plural () {
            case "$(($1 % 100))" in
              11|12|13|14) printf '%s' "$4" ;;
              *) case "$(($1 % 10))" in
                   1)     printf '%s' "$2" ;;
                   2|3|4) printf '%s' "$3" ;;
                   *)     printf '%s' "$4" ;;
                 esac ;;
            esac
          }
          commits () { plural "$1" коммит коммита коммитов; }

          # button <текст> <ссылка> — кнопка-ссылка под сообщением
          button () { MARKUP=$(jq -nc --arg t "$1" --arg u "$2" '{inline_keyboard: [[{text: $t, url: $u}]]}'); }

          # quote <текст> — описание или комментарий из GitHub → HTML Telegram: без HTML-тегов и комментариев,
          # картинки ссылками, markdown — разметкой, не длиннее 700 символов. Код (`…`, ```…```) не трогаем.
          # -Mutf8: без него «…» в коде — три байта, и в сообщение попадает «â¦»
          quote () {
            printf '%s' "$1" | perl -CS -Mutf8 -0777 -pe '
              my $code = qr/```.*?```|`[^`\n]+`/s;
              s/\r//g; s{($code)|<!--.*?-->}{$1 // ""}gse;
              s{($code)|<img\b[^>]*?\bsrc="([^"]+)"[^>]*>}{$1 // "[🖼 картинка]($2)"}gie;
              s{($code)|!\[[^\]\n]*\]\(([^)\s]+)[^)\n]*\)}{$1 // "[🖼 картинка]($2)"}ge;
              s{($code)|<br\s*/?>|</(?:p|div|summary|details|li|tr|h\d)>}{$1 // "\n"}gie;
              # автоссылка и адрес в <...> — не тег, оставляем ссылкой/текстом до общей зачистки тегов
              s{($code)|<(https?://[^<>\s]+)>}{$1 // "[$2]($2)"}ge;
              s{($code)|<([^<>\s@]+@[^<>\s]+)>}{$1 // $2}ge;
              s{($code)|</?[A-Za-z][^<>\n]*>}{$1 // ""}ge;
              s/[ \t]+$//gm; s/\n{3,}/\n\n/g; s/^\s+|\s+$//g;
              $_ = substr($_, 0, 700) . "…" if length > 700;
              s/&/&amp;/g; s/</&lt;/g; s/>/&gt;/g;
              my @k;
              my $fences = () = /^```/mg;
              s/\A(.*)^```[^\n]*\n?/$1/sm if $fences % 2;
              s{^```[^\n]*\n(.*?)\n?^```[ \t]*$}{push @k, "<pre>$1</pre>"; "\x00$#k\x00"}gems;
              s{`([^`\n]+)`}{push @k, "<code>$1</code>"; "\x00$#k\x00"}ge;
              # ** внутри заголовка снимаем — иначе жирный текст в заголовке даёт <b><b>x</b></b>
              s{^#{1,6}[ \t]+(.+?)[ \t#]*$}{my $h = $1; $h =~ s/\*\*//g; "<b>$h</b>"}gme;
              s{\*\*(?=\S)(.+?)(?<=\S)\*\*}{<b>$1</b>}g;
              s{~~(?=\S)(.+?)(?<=\S)~~}{<s>$1</s>}g;
              s{\[([^\]\n]+)\]\((https?://[^)\s"]+)\)}{<a href="$2">$1</a>}g;
              s/^([ \t]*)[-*+][ \t]+\[ \][ \t]+/$1☐ /gm;
              s/^([ \t]*)[-*+][ \t]+\[[xX]\][ \t]+/$1☑ /gm;
              s/^([ \t]*)[-*+][ \t]+/$1• /gm;
              s/\x00(\d+)\x00/$k[$1]/g;
            '
          }

          # LAST="<состояние>\t<коммит>" последнего отправленного ревью REVIEWER на этом PR, пусто — не ревьюил;
          # API недоступен — пусто и предупреждение в лог: лучше обычный запрос, чем упавший job
          last_review () {
            ERR="${RUNNER_TEMP:-/tmp}/gh-reviews.err"
            if LAST=$(gh api "repos/$REPO/pulls/$NUMBER/reviews" --paginate \
                --jq ".[] | select(.user.login == \"$REVIEWER\" and .state != \"PENDING\") | [.state, .commit_id] | @tsv" 2>"$ERR"); then
              LAST=$(printf '%s\n' "$LAST" | tail -n 1)
            else
              LAST=""
              echo "::warning::Не прочитал ревью PR, считаю запрос первым: $(head -c 200 "$ERR")"
            fi
          }

          # серия ревью REVIEW_BY — идущие подряд с конца отправленные ревью с паузами короче 3 минут
          # (столько ждём перед отправкой, см. REVIEW_WAIT). NOTES — сколько в серии комментариев:
          # inline плюс ревью с общим текстом; пусто — API недоступен. FIRST_URL — первое ревью серии
          series () {
            NOTES=""
            FIRST_URL="$REVIEW_URL"
            ERR="${RUNNER_TEMP:-/tmp}/gh-series.err"
            if ! LIST=$(gh api "repos/$REPO/pulls/$NUMBER/reviews" --paginate \
                --jq ".[] | select(.user.login == \"$REVIEW_BY\" and .state != \"PENDING\") | [.id, .submitted_at, ((.body // \"\") != \"\"), .html_url] | @tsv" 2>"$ERR"); then
              echo "::warning::Не прочитал ревью PR, сообщение без числа комментариев: $(head -c 200 "$ERR")"
              return 0
            fi
            SERIES=$(printf '%s\n' "$LIST" | jq -Rsc '
              [gsub("\r"; "") | split("\n")[] | select(length > 0) | split("\t")
                | {id: .[0], at: (.[1] | fromdateiso8601), body: (.[2] == "true"), url: .[3]}]
              | sort_by(.at) | reverse
              | reduce .[] as $x ({s: [], open: true};
                  if .open and ((.s | length) == 0 or (.s[-1].at - $x.at) < 180)
                  then .s += [$x] else .open = false end)
              | .s | reverse')
            [ "$(printf '%s' "$SERIES" | jq 'length')" -gt 0 ] || return 0
            FIRST_URL=$(printf '%s' "$SERIES" | jq -r '.[0].url')
            if ! INLINE=$(gh api "repos/$REPO/pulls/$NUMBER/comments" --paginate \
                --jq '.[].pull_request_review_id' 2>"$ERR"); then
              echo "::warning::Не прочитал комментарии PR, сообщение без их числа: $(head -c 200 "$ERR")"
              return 0
            fi
            NOTES=$(jq -n --argjson s "$SERIES" --arg inline "$INLINE" '
              ($s | map(.id)) as $ids
              | ([$inline | gsub("\r"; "") | split("\n")[] | select(. as $i | $ids | index($i))] | length)
                + ($s | map(select(.body)) | length)')
          }

          # rewritten — force-push: коммиты ветки берём из сравнения с веткой по умолчанию, а не из события —
          # там до 20 коммитов и вся переписанная ветка, включая подтянутое из main. Новые — чьих заголовков
          # не было в ветке до пуша. Ставит HEAD, NOTE, COMMITS и COUNT (что перечислить) и кнопку
          rewritten () {
            BASE_BR="${DEFAULT_BRANCH:-main}"
            ERR="${RUNNER_TEMP:-/tmp}/gh-compare.err"
            if ! NOW_LIST=$(gh api "repos/$REPO/compare/$BASE_BR...$AFTER?per_page=100" --paginate \
                --jq '.commits[] | {id: .sha, message: .commit.message}' 2>"$ERR"); then
              if grep -qF "No common ancestor" "$ERR"; then
                HEAD="⚠️ force-push"
                NOTE="у ветки нет общей истории с $(esc "$BASE_BR")"
              else
                echo "::warning::Не сравнил ветку с $BASE_BR, коммиты из события: $(head -c 200 "$ERR")"
                [ "$COUNT" -eq 0 ] && exit 0
                HEAD="⚠️ $COUNT $(commits "$COUNT") (force-push)"
              fi
              return 0
            fi
            ALL=$(printf '%s' "$NOW_LIST" | jq -sc '.')
            TOTAL=$(printf '%s' "$ALL" | jq 'length')
            HEAD="⚠️ force-push"
            button "Ветка целиком" "https://github.com/$REPO/compare/$BASE_BR...$BR"
            if [ "$TOTAL" -eq 0 ]; then
              NOTE="ветка сброшена до $(esc "$BASE_BR")"
              COMMITS='[]'
              COUNT=0
              return 0
            fi
            NOTE="ветка переписана: $TOTAL $(commits "$TOTAL") поверх $(esc "$BASE_BR")"
            # старой версии ветки может уже не быть — тогда все коммиты ветки
            if OLD=$(gh api "repos/$REPO/compare/$BASE_BR...$BEFORE?per_page=100" --paginate \
                --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null); then
              COMMITS=$(printf '%s' "$ALL" | jq -c --arg old "$(printf '%s' "$OLD" | tr -d '\r')" '
                ($old | split("\n")) as $o | map(select((.message | split("\n")[0]) as $t | $o | any(. == $t) | not))')
              COUNT=$(printf '%s' "$COMMITS" | jq 'length')
              if [ "$COUNT" -eq 0 ]; then
                NOTE="$NOTE, новых коммитов нет"
              else
                NOTE="$NOTE, новых — $COUNT"
              fi
            else
              COMMITS="$ALL"
              COUNT="$TOTAL"
            fi
          }

          case "$EVENT:$ACTION" in
            push:)
              # удаление ветки — событие есть, новостей нет
              [ "$DELETED" = "true" ] && exit 0
              # коммиты, которые уже были в других ветках (подтянутые из main), — не новость
              COMMITS=$(printf '%s' "$COMMITS" | jq -c 'map(select(.distinct))')
              COUNT=$(printf '%s' "$COMMITS" | jq 'length')
              BR="${BRANCH#refs/heads/}"
              button "Открыть изменения" "$COMPARE"
              if [ "$FORCED" = "true" ]; then
                rewritten
              else
                # создание ветки, пуш тега — событие есть, коммитов нет
                [ "$COUNT" -eq 0 ] && exit 0
                HEAD="⚒️ $COUNT $(commits "$COUNT")"
              fi ;;
            issues:opened)   HEAD="🆕 Новая задача" ;;
            issues:closed)   HEAD="✅ Задача закрыта" ;;
            issues:reopened) HEAD="♻️ Задача переоткрыта" ;;
            issues:edited)
              # правка заголовка — changes.body отсутствует
              [ "$CHG_BODY" = "null" ] && exit 0
              # доработка сразу после создания — часть создания, о ней уже сообщили
              AGE=$(( $(date -d "$UPDATED" +%s) - $(date -d "$CREATED" +%s) ))
              [ "$AGE" -lt 600 ] && exit 0
              HEAD="✏️ Описание изменено" ;;
            pull_request:opened|pull_request:ready_for_review)
              # о черновике сообщим, когда его переведут в ready_for_review
              [ "$ACTION" = "opened" ] && [ "$DRAFT" = "true" ] && exit 0
              # ревьюверы из формы создания и из черновика — в этом же сообщении
              REVS=$(printf '%s' "$REVIEWERS" | jq -r '[.[]?.login] | join(" ")')
              button "Открыть PR" "$URL"
              KIND=opened
              HEAD="🔀 Открыт pull request" ;;
            pull_request:review_requested)
              # ревью может быть запрошено у команды — тогда упоминать некого
              [ -z "$REVIEWER" ] && exit 0
              # у черновика ревьювер попадёт в сообщение на ready_for_review
              [ "$DRAFT" = "true" ] && exit 0
              # ревьювера выбрали в форме создания: GitHub шлёт запрос сразу после opened,
              # а в сообщении об открытии он уже есть
              AGE=$(( $(date +%s) - $(date -d "$PR_CREATED" +%s) ))
              [ "$AGE" -lt 60 ] && exit 0
              REVS="$REVIEWER"
              button "Начать ревью" "$URL/files"
              KIND=requested
              DEST="$RTOPIC"
              HEAD="👀 Запрошено ревью"
              # ревьювер уже ревьюил PR — автор внёс правки и просит посмотреть снова
              last_review
              if [ -n "$LAST" ]; then
                IFS=$'\t' read -r STATE SHA <<< "$LAST"
                case "$STATE" in
                  CHANGES_REQUESTED) VERDICT="✋ правки" ;;
                  APPROVED)          VERDICT="👍 апрув" ;;
                  DISMISSED)         VERDICT="ревью снято" ;;
                  *)                 VERDICT="💬 комментарии" ;;
                esac
                HEAD="🔁 Повторное ревью"
                REVIEW_DELTA="после твоего ревью ($VERDICT)"
                # после force-push коммита ревью может уже не быть — тогда без числа и кнопки
                if AHEAD=$(gh api "repos/$REPO/compare/$SHA...$HEAD_SHA" --jq .ahead_by 2>/dev/null) &&
                  [[ "$AHEAD" =~ ^[0-9]+$ ]]; then
                  if [ "$AHEAD" -eq 0 ]; then
                    REVIEW_DELTA="$REVIEW_DELTA: новых коммитов нет"
                  else
                    REVIEW_DELTA="$REVIEW_DELTA: $AHEAD $(commits "$AHEAD")"
                    button "Что изменилось" "https://github.com/$REPO/pull/$NUMBER/files/$SHA..$HEAD_SHA"
                  fi
                fi
              fi ;;
            pull_request:closed)
              button "Открыть PR" "$URL"
              if [ "$MERGED" = "true" ]; then
                HEAD="🎉 Влито в $(esc "$BASE")"
              else
                HEAD="🚫 PR закрыт без мержа"
              fi ;;
            pull_request_review:submitted)
              DEST="$RTOPIC"
              # ответы автора в ветках обсуждения и ревью ботов — не новость
              [ "$REVIEW_BY" = "$PR_AUTHOR" ] && exit 0
              [ "$REVIEW_BY_TYPE" = "Bot" ] && exit 0
              case "$REVIEW" in
                approved)          HEAD="👍 Апрув" ;;
                changes_requested) HEAD="✋ Запрошены правки" ;;
                commented)
                  # каждый одиночный комментарий — отдельное событие: ждём, пока ревьювер затихнет;
                  # его следующий комментарий отменит этот запуск (concurrency у job)
                  sleep "${REVIEW_WAIT:-180}"
                  HEAD="💬 Комментарии к PR" ;;
                *) exit 0 ;;
              esac
              KIND=reviewed
              series
              if [ -n "$FIRST_URL" ] && { [ "$REVIEW" = "commented" ] || [ "${NOTES:-0}" -gt 0 ]; }; then
                button "Открыть ревью" "$FIRST_URL"
              fi ;;
            issue_comment:created)
              # комментарии ботов — не новость
              [ "$COMMENT_BY_TYPE" = "Bot" ] && exit 0
              # служебные комментарии автоматики (закрытие мержем, перенос задач) — тоже
              case "$COMMENT_BODY" in '<!-- auto -->'*) exit 0 ;; esac
              KIND=comment
              button "Открыть комментарий" "$COMMENT_URL"
              if [ "$IS_PR" = "true" ]; then
                # обсуждение PR — в топик ревью: пишет не автор — действовать автору,
                # автор отвечает — ревьюверам
                DEST="$RTOPIC"
                HEAD="💬 Комментарий к PR"
                if [ "$COMMENT_BY" = "$ISSUE_AUTHOR" ]; then
                  ERR="${RUNNER_TEMP:-/tmp}/gh-pr.err"
                  if ! PING=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '[.requested_reviewers[].login] | join(" ")' 2>"$ERR"); then
                    echo "::warning::Не прочитал ревьюверов PR, комментарий без пинга: $(head -c 200 "$ERR")"
                    PING=""
                  fi
                else
                  PING="$ISSUE_AUTHOR"
                fi
              else
                # под задачей — исполнителям и автору задачи, кроме того, кто пишет
                HEAD="💬 Комментарий"
                PING=$(printf '%s' "$ASSIGNEES" | jq -r --arg me "$COMMENT_BY" --arg author "$ISSUE_AUTHOR" '
                  [(.[]?.login), $author] | map(select(. != "" and . != $me))
                  | reduce .[] as $x ([]; if any(.[]; . == $x) then . else . + [$x] end) | join(" ")')
              fi
              PING=$(printf '%s' "$PING" | tr -d '\r') ;;
            *) exit 0 ;;
          esac

          case "$REPO" in
            frontend-park-mail-ru/*) SIDE="frontend" ;;
            go-park-mail-ru/*)       SIDE="backend" ;;
            *)                       SIDE="${REPO#*/}" ;;
          esac

          # логин есть в карте — кликабельное упоминание, нет — просто текст
          mention () {
            TGID=""
            if [ -n "$MAP" ]; then
              TGID=$(printf '%s' "$MAP" | jq -r --arg u "$1" '.[$u] // empty' 2>/dev/null || true)
            fi
            if [ -n "$TGID" ]; then
              printf '<a href="tg://user?id=%s">%s</a>' "$TGID" "$(esc "$1")"
            else
              esc "$1"
            fi
          }

          # "a b" → упоминания через запятую; mentions "a b" plain — логины без ссылок
          mentions () {
            ML=""
            for N in $1; do
              [ -n "$ML" ] && ML="$ML, "
              if [ "${2:-}" = "plain" ]; then
                ML="$ML$(esc "$N")"
              else
                ML="$ML$(mention "$N")"
              fi
            done
            printf '%s' "$ML"
          }

          # строка запроса ревью: пингуем тех, кого ждут, автор — текстом
          asked () { printf 'автор: %s · ревьювер: %s' "$(esc "$PR_AUTHOR")" "$(mentions "$REVS")"; }

          # карточка задачи или PR: заголовок · сторона, ссылка, строка с людьми
          card () {
            printf '<b>%s</b> · %s\n<a href="%s">%s%s</a>\n%s%s' \
              "$1" "$SIDE" "$URL" "$REF" "$(esc "$TITLE")" "$2" "$EXTRA"
          }

          # send <топик> <текст> [<текст без цитаты>] — отправить в Telegram; отказ валит job.
          # Разметку цитаты из описания или комментария Telegram может не разобрать — тогда шлём без цитаты
          send () {
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT" \
              -d message_thread_id="$1" \
              -d parse_mode=HTML \
              -d disable_web_page_preview=true \
              --data-urlencode reply_markup="$MARKUP" \
              --data-urlencode text="$2")
            echo "$RESP"
            case "$RESP" in
              *'"ok":true'*) ;;
              *"can't parse entities"*)
                [ -n "${3:-}" ] || { echo "::error::Telegram отклонил сообщение"; exit 1; }
                echo "::warning::Telegram не разобрал разметку цитаты, отправляю без неё"
                send "$1" "$3" ;;
              *) echo "::error::Telegram отклонил сообщение"; exit 1 ;;
            esac
          }

          if [ "$EVENT" = "push" ]; then
            # у Telegram лимит 4096 символов — длинный пуш иначе отвалится молча
            LIST=$(printf '%s' "$COMMITS" | jq -r '.[0:10][] | "• \(.id[0:7]) \(.message | split("\n")[0])"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            [ "$COUNT" -gt 10 ] && LIST=$(printf '%s\n…и ещё %s' "$LIST" "$((COUNT - 10))")

            TEXT=$(printf '<b>%s</b> · %s · <a href="https://github.com/%s/tree/%s">%s</a>' \
              "$HEAD" "$SIDE" "$REPO" "$BR" "$(esc "$BR")")
            for L in "$NOTE" "$LIST" "$(mention "$WHO")"; do
              if [ -n "$L" ]; then TEXT="$TEXT"$'\n'"$L"; fi
            done
          else
            # у issue номер — единственный идентификатор,
            # у PR он уже есть в заголовке вида "WEB-11: ..."
            if [ "$KIND" = "comment" ]; then
              # ссылка в заголовке — сразу на комментарий
              URL="$COMMENT_URL"
              REF=""
              [ "$IS_PR" = "true" ] || REF="#$NUMBER "
              LINE="от: $(esc "$COMMENT_BY")"
              [ -n "$PING" ] && LINE="$LINE · для: $(mentions "$PING")"
              Q=$(quote "$COMMENT_BODY")
              [ -n "$Q" ] && EXTRA=$(printf '\n<blockquote expandable>%s</blockquote>' "$Q")
            elif [ "$EVENT" = "issues" ]; then
              REF="#$NUMBER "
              button "Открыть задачу" "$URL"
              LINE="автор: $(mention "$WHO")"
              NAMES=$(printf '%s' "$ASSIGNEES" | jq -r '[.[].login] | join(" ")' 2>/dev/null || true)
              [ -n "$NAMES" ] && LINE="$LINE · исполнитель: $(mentions "$NAMES")"
              # описание показываем при создании и правке, на закрытии это шум
              if { [ "$ACTION" = "opened" ] || [ "$ACTION" = "edited" ]; } && [ -n "$BODY" ]; then
                Q=$(quote "$BODY")
                [ -n "$Q" ] && EXTRA=$(printf '\n<blockquote expandable>%s</blockquote>' "$Q")
              fi
            else
              REF=""
              case "$KIND" in
                # в общем топике ревьюверы текстом: пинг им уйдёт в топик ревью
                opened)
                  LINE="автор: $(mention "$PR_AUTHOR")"
                  [ -n "$REVS" ] && LINE="$LINE · ревьювер: $(mentions "$REVS" plain)" ;;
                requested)
                  LINE=$(asked)
                  [ -n "$REVIEW_DELTA" ] && LINE=$(printf '%s\n%s' "$LINE" "$REVIEW_DELTA") ;;
                # ревью оставлено: действовать автору — пингуем его, ревьювер текстом
                reviewed)
                  LINE="автор: $(mention "$PR_AUTHOR") · ревьювер: $(esc "$REVIEW_BY")"
                  if [ "${NOTES:-0}" -gt 0 ]; then
                    LINE=$(printf '%s\n%s %s' "$LINE" "$NOTES" "$(plural "$NOTES" комментарий комментария комментариев)")
                  fi ;;
                *)         LINE=$(mention "$WHO") ;;
              esac
            fi

            TEXT=$(card "$HEAD" "$LINE")
            # запасной вариант на случай, если Telegram не разберёт разметку цитаты
            if [ -n "$EXTRA" ]; then BARE=$(EXTRA=""; card "$HEAD" "$LINE"); fi
          fi

          send "$DEST" "$TEXT" "$BARE"

          # ревьюверы, выбранные при создании PR или в черновике, — запрос ревью в топик ревью
          if [ "$KIND" = "opened" ] && [ -n "$REVS" ]; then
            button "Начать ревью" "$URL/files"
            send "$RTOPIC" "$(card "👀 Запрошено ревью" "$(asked)")"
          fi

          # после force-push, который оставил ветку без изменений или без общей истории с main,
          # GitHub сам закрывает её PR — и события pull_request об этом не шлёт.
          # Узнаём такой PR по закрытию в ту же секунду, что и force-push; закрытый человеком
          # уже получил своё сообщение. API недоступен — предупреждение в лог, пуш уже отправлен
          if [ "$EVENT" = "push" ] && [ "$FORCED" = "true" ]; then
            ERR="${RUNNER_TEMP:-/tmp}/gh-closed.err"
            if ! PRS=$(gh api "repos/$REPO/pulls?state=closed&head=$OWNER:$BR&sort=updated&direction=desc&per_page=5" \
                --jq '.[] | select(.merged_at == null) | [.number, .closed_at, .html_url, .user.login, .title] | @tsv' 2>"$ERR"); then
              echo "::warning::Не проверил, закрыл ли GitHub PR ветки: $(head -c 200 "$ERR")"
              PRS=""
            fi
            while IFS=$'\t' read -r N AT PURL AUTHOR PTITLE; do
              [ -n "$N" ] || continue
              AT_EPOCH=$(date -d "$AT" +%s)
              if [[ "$PUSHED_AT" =~ ^[0-9]+$ ]]; then
                # PUSHED_AT есть — сверяем закрытие с этим пушем в упор: второй, корректирующий
                # force-push в те же 5 минут не должен снова взять вину на себя
                DIFF=$(( AT_EPOCH - PUSHED_AT ))
                [ "${DIFF#-}" -le 10 ] || continue
              else
                # PUSHED_AT недоступен — старое окно: закрыт давно — не этим пушем
                [ $(( $(date +%s) - AT_EPOCH )) -lt 300 ] || continue
              fi
              if ! EV=$(gh api "repos/$REPO/issues/$N/events?per_page=100" --paginate \
                  --jq '.[] | select(.event == "closed" or .event == "head_ref_force_pushed") | "\(.event) \(.created_at)"' 2>"$ERR"); then
                echo "::warning::Не прочитал события PR #$N: $(head -c 200 "$ERR")"
                continue
              fi
              EV=$(printf '%s' "$EV" | tr -d '\r')
              if grep -qxF "closed $AT" <<< "$EV" && grep -qxF "head_ref_force_pushed $AT" <<< "$EV"; then
                URL="$PURL"
                TITLE="$PTITLE"
                REF=""
                EXTRA=""
                button "Открыть PR" "$PURL"
                LINE=$(printf 'автор: %s\nGitHub закрыл PR после force-push: у ветки не осталось изменений или общей истории с %s' \
                  "$(mention "$AUTHOR")" "$(esc "$BASE_BR")")
                send "$TOPIC" "$(card "🚫 PR закрыт без мержа" "$LINE")"
              fi
            done <<< "$(printf '%s' "$PRS" | tr -d '\r')"
          fi
