name: GitHubBot image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'Cringe-Driven-Development-Team/.github' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: githubbot-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install, test and typecheck GitHubBot
        run: |
          bun install --frozen-lockfile --cwd services/githubbot
          bun test services/githubbot/tests tests/githubbot-workflows.test.ts
          bun run --cwd services/githubbot typecheck
      - name: Build and smoke test GitHubBot image
        run: |
          docker build -f services/githubbot/Dockerfile -t githubbot:test .
          bash tests/githubbot-docker.sh githubbot:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish full commit tag and verify registry digest
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${REGISTRY_OWNER,,}/githubbot"
          image="$repository:sha-$IMAGE_SHA"
          docker tag githubbot:test "$image"
          docker push "$image"
          docker pull "$image"
          repo_digests=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          digest=''
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$repository"@sha256:* ]]; then
              digest="$candidate"
              break
            fi
          done <<< "$repo_digests"
          [[ "$digest" == "$repository"@sha256:* ]]
          [[ "${digest#"$repository"@sha256:}" =~ ^[0-9a-f]{64}$ ]]
          echo "Published $digest from $IMAGE_SHA"
          echo "GitHubBot: $digest (source $IMAGE_SHA)" >> "$GITHUB_STEP_SUMMARY"
