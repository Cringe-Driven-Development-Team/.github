name: GitHubBot image

on:
  push:
    branches: [main]
    paths:
      - 'services/githubbot/src/**'
      - 'services/githubbot/tests/**'
      - 'services/githubbot/package.json'
      - 'services/githubbot/bun.lock'
      - 'services/githubbot/tsconfig.json'
      - 'services/githubbot/Dockerfile'
      - 'services/githubbot/.dockerignore'
      - 'services/webhook-alerts/src/format.ts'
      - '.github/workflows/githubbot-image.yml'
      - '.github/workflows/checks.yml'
      - 'tests/githubbot-workflows.test.ts'
      - 'tests/githubbot-docker.sh'
      - 'scripts/auxiliary-publish.sh'
      - 'tests/auxiliary-publish.test.ts'
      - '.dockerignore'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'Cringe-Driven-Development-Team/.github' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
    concurrency:
      group: githubbot-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install, test and typecheck GitHubBot
        run: |
          bun install --frozen-lockfile --cwd services/githubbot
          bun test services/githubbot/tests tests/githubbot-workflows.test.ts tests/auxiliary-publish.test.ts
          bun run --cwd services/githubbot typecheck
      - name: Build and smoke test GitHubBot image
        run: |
          docker build -f services/githubbot/Dockerfile -t githubbot:test .
          bash tests/githubbot-docker.sh githubbot:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or reuse verified immutable release
        id: release
        env:
          IMAGE_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/auxiliary-publish.sh githubbot githubbot:test
      - uses: actions/upload-artifact@v4
        with:
          name: release-githubbot-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
