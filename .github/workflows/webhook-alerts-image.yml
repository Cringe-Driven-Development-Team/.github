name: Webhook alerts image

on:
  push:
    branches: [main]
    paths:
      - 'services/webhook-alerts/src/**'
      - 'services/webhook-alerts/tests/**'
      - 'services/webhook-alerts/package.json'
      - 'services/webhook-alerts/bun.lock'
      - 'services/webhook-alerts/tsconfig.json'
      - 'services/webhook-alerts/Dockerfile'
      - 'services/webhook-alerts/.dockerignore'
      - 'services/webhook-alerts/src/format.ts'
      - '.github/workflows/webhook-alerts-image.yml'
      - '.github/workflows/checks.yml'
      - 'tests/webhook-workflows.test.ts'
      - 'tests/webhook-alerts-docker.sh'
      - 'scripts/auxiliary-publish.sh'
      - 'tests/auxiliary-publish.test.ts'
      - '.dockerignore'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'Cringe-Driven-Development-Team/.github' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
    concurrency:
      group: webhook-alerts-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install, test and typecheck webhook service
        run: |
          bun install --frozen-lockfile --cwd services/webhook-alerts
          bun test services/webhook-alerts/tests tests/webhook-workflows.test.ts tests/auxiliary-publish.test.ts
          bun run --cwd services/webhook-alerts typecheck
      - name: Build and smoke test webhook service image
        run: |
          docker build -t webhook-alerts:test services/webhook-alerts
          bash tests/webhook-alerts-docker.sh webhook-alerts:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or reuse verified immutable release
        id: release
        env:
          IMAGE_SHA: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/auxiliary-publish.sh webhook-alerts webhook-alerts:test
      - uses: actions/upload-artifact@v4
        with:
          name: release-webhook-alerts-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
