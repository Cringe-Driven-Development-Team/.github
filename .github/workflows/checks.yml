name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webhook-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install webhook service dependencies
        working-directory: services/webhook-alerts
        run: bun install --frozen-lockfile
      - name: Test and typecheck webhook service
        working-directory: services/webhook-alerts
        run: |
          bun test
          bunx tsc --noEmit
      - name: Build webhook service image
        run: docker build -t webhook-alerts:test services/webhook-alerts
      - name: Check image health, persistence and snapshot CLI
        run: bash tests/webhook-alerts-docker.sh webhook-alerts:test
      - name: Check event sender switch and publication
        run: bun test tests/webhook-workflows.test.ts
  course-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: actions/course-sync-context/package-lock.json
      - name: Install action dev dependencies
        working-directory: actions/course-sync-context
        run: npm ci
      - name: Test and typecheck action
        working-directory: actions/course-sync-context
        run: |
          npm test
          npm run typecheck
      - name: Build and verify committed action
        run: |
          npm run build --prefix actions/course-sync-context
          git diff --exit-code -- actions/course-sync-context/dist/main.js
      - name: Test sync shell integration
        run: |
          bash tests/course-sync-workflow.sh
          bash tests/course-sync-git.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
      - name: Install workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflows and shell
        run: bash tests/lint.sh
