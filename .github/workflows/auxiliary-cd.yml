name: Auxiliary CD

on:
  workflow_run:
    workflows: [GitHubBot image, Webhook alerts image]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.repository == 'Cringe-Driven-Development-Team/.github' &&
      github.event.workflow_run.repository.full_name == 'Cringe-Driven-Development-Team/.github' &&
      github.event.workflow_run.head_repository.full_name == 'Cringe-Driven-Development-Team/.github' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Deploy publisher release and await actual result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUXILIARY_DEPLOY_TOKEN: ${{ secrets.AUXILIARY_DEPLOY_TOKEN }}
        run: bun .github/scripts/auxiliary-cd.ts
