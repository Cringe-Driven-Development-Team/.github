name: Напоминания о ревью

on:
  schedule:
    # 00:01, 15:00, 20:00 по Москве; GitHub может задержать запуск. UTC: МСК − 3 часа.
    # Ночной запуск отдельной строкой: по ней job узнаёт, что пора разослать дайджест ревью,
    # проверить срок токена доски и смену спринта; в 15:00 и 20:00 — только сбои и новые репозитории
    - cron: '1 21 * * *'
    - cron: '0 12,17 * * *'
  workflow_dispatch:
    inputs:
      sprint:
        description: Проверить смену спринта (перенос хвостов и сообщение), как в ночном запуске
        type: boolean
        default: false
      min_hours:
        description: Сколько часов ревью или апрув должны ждать, чтобы попасть в напоминание
        default: '4'

permissions:
  contents: read
  actions: read

# ручной запуск (sprint=true), наложившийся на ночной по расписанию, не должен постить смену
# спринта дважды — общая группа на весь workflow не даёт им выполняться параллельно
concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Смена спринта
        if: ${{ !cancelled() && (github.event.schedule == '1 21 * * *' || inputs.sprint) }}
        env:
          PAT:   ${{ secrets.ADD_TO_PROJECT_PAT }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:  ${{ vars.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ vars.TELEGRAM_TOPIC_ID }}
          MAP:   ${{ vars.TELEGRAM_USER_MAP }}
          # «всё сделано» на первый день без хвостов — только из планового ночного запуска,
          # первой попытки: ручной прогон и повтор той же попытки не должны постить его заново
          ANNOUNCE_EMPTY: ${{ github.event.schedule == '1 21 * * *' && github.run_attempt == '1' }}
        run: bash scripts/sprint.sh
      - name: Напомнить о ревью и проверить уведомления
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN:  ${{ github.token }}
          TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:      ${{ vars.TELEGRAM_CHAT_ID }}
          TOPIC:     ${{ vars.TELEGRAM_REVIEW_TOPIC_ID || vars.TELEGRAM_TOPIC_ID }}
          OPS_TOPIC: ${{ vars.TELEGRAM_TOPIC_ID }}
          MAP:       ${{ vars.TELEGRAM_USER_MAP }}
          MIN_HOURS: ${{ inputs.min_hours || '4' }}
          PAT:       ${{ secrets.ADD_TO_PROJECT_PAT }}
          DAILY:     ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '1 21 * * *' }}
          COURSE_MIGRATED_REPOS: ${{ vars.COURSE_MIGRATED_REPOS }}
        run: bash scripts/reminders.sh
