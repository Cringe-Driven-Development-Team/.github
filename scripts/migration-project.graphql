query ProjectFields($owner: String!, $number: Int!, $cursor: String) {
  organization(login: $owner) {
    projectV2(number: $number) {
      id
      fields(first: 100, after: $cursor) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes {
          __typename
          ... on ProjectV2FieldCommon { id name dataType }
          ... on ProjectV2SingleSelectField { options { id name color description } }
          ... on ProjectV2IterationField {
            configuration {
              duration startDay
              iterations { id title startDate duration }
              completedIterations { id title startDate duration }
            }
          }
        }
      }
    }
  }
}

query ProjectPage($owner: String!, $number: Int!, $cursor: String) {
  organization(login: $owner) {
    projectV2(number: $number) {
      id
      items(first: 100, after: $cursor, archivedStates: [ARCHIVED, NOT_ARCHIVED]) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes {
          id isArchived
          content { __typename ... on Issue { id repository { nameWithOwner } } }
          fieldValues(first: 100) { ...FieldValues }
        }
      }
    }
  }
}

query ItemValues($item: ID!, $cursor: String) {
  node(id: $item) {
    ... on ProjectV2Item {
      id
      fieldValues(first: 100, after: $cursor) { ...FieldValues }
    }
  }
}

query IssueRelations($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
  repository(owner: $owner, name: $repo) {
    issue(number: $number) {
      id
      parent { id }
      subIssues(first: 100, after: $cursor) {
        totalCount
        pageInfo { hasNextPage endCursor }
        nodes { id }
      }
    }
  }
}

fragment FieldValues on ProjectV2ItemFieldValueConnection {
  totalCount
  pageInfo { hasNextPage endCursor }
  nodes {
    __typename
    ... on ProjectV2ItemFieldValueCommon {
      id
      field { ... on ProjectV2FieldCommon { id } }
    }
    ... on ProjectV2ItemFieldUserValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldLabelValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldMilestoneValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldPullRequestValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldRepositoryValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldReviewerValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemIssueFieldValue { field { ... on ProjectV2FieldCommon { id } } }
    ... on ProjectV2ItemFieldSingleSelectValue { optionId }
    ... on ProjectV2ItemFieldIterationValue { iterationId }
    ... on ProjectV2ItemFieldTextValue { text }
    ... on ProjectV2ItemFieldNumberValue { number }
    ... on ProjectV2ItemFieldDateValue { date }
  }
}
